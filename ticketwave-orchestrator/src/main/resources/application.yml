server:
  port: 8086

spring:
  application:
    name: ticketwave-orchestrator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:rabbitmq}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      repositories:
        enabled: false

ticketwave:
  redis-prefix: ticketwave
  bus:
    events-queue: ${BUS_EVENTS_QUEUE:ticketwave.events.orchestrator}
  saga:
    recovery-enabled: ${SAGA_RECOVERY_ENABLED:true}
    recovery-interval-ms: ${SAGA_RECOVERY_INTERVAL:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.ticketwave: DEBUG
