_format_version: "3.0"
_transform: true

services:
  - name: service-8091
    url: http://host.docker.internal:8091
    routes:
      - name: route-8091
        paths:
          - /api8091
        strip_path: true
      - name: route-8091-docs
        paths:
          - /v3/api-docs/reports
        strip_path: false
      - name: route-8091-swagger-ui
        paths:
          - /reports
        strip_path: false

  - name: service-8090
    url: http://host.docker.internal:8090
    routes:
      - name: route-8090
        paths:
          - /api8090
        strip_path: true
      - name: route-8090-docs
        paths:
          - /v3/api-docs/ticketorder
        strip_path: false
      - name: route-8090-swagger-ui
        paths:
          - /ticketorder
        strip_path: false

  - name: service-8081
    url: http://host.docker.internal:8081
    routes:
      - name: route-8081
        paths:
          - /api8081
        strip_path: true
      - name: route-8081-docs
        paths:
          - /v3/api-docs/legacy
        strip_path: false
      - name: route-8081-swagger-ui
        paths:
          - /legacy
        strip_path: false

plugins:
  - name: prometheus
  
  - name: http-log
    config:
      http_endpoint: http://host.docker.internal:8085/logs
      method: POST
      timeout: 1000
      keepalive: 30
      flush_timeout: 2


