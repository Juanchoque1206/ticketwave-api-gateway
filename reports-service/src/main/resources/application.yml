server:
  port: 8082

spring:
  application:
    name: reports-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${REPORTS_DB_URL:jdbc:postgresql://localhost:5432/ticketwave}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      continue-on-error: true

ticketwave:
  jwt:
    secret: ${JWT_SECRET:ChangeThisSecretKeyInProductionToASecureRandomValueOfAtLeast32BytesLong}
    expiration-ms: ${JWT_EXPIRATION:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.ticketwave.reports: DEBUG
