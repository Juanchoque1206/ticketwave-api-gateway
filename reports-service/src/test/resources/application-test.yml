spring:
  datasource:
    url: jdbc:h2:mem:reports_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

ticketwave:
  jwt:
    secret: TestOnlySecretKeyThatIsAtLeastThirtyTwoBytesLongForTests
    expiration-ms: 3600000
